services:
  # 第一层：外网入口点 - Apache HTTP Server 2.4.49 路径穿越漏洞（CVE-2021-41773）
  apache-entry:
    build: ./CVE-2021-41773
    container_name: fullchain2_apache
    ports:
      - "${FC2_APACHE_PORT:-10000}:80"
    environment:
      - APACHE_DOCUMENT_ROOT=/var/www/html
    volumes:
      - ./flag_without_ignore/flag1_apache.txt:/tmp/flag.txt:ro # Flag for Apache traversal
    networks:
      frontend_network:
        ipv4_address: 172.22.0.10
      dmz_network:
        ipv4_address: 172.23.0.5
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80 || exit 1"]
      timeout: 30s
      retries: 3
      interval: 30s
      start_period: 30s

  # 第二层：DMZ跳板 - Spring CVE-2022-22965 RCE
  spring-dmz:
    build: ./CVE-2022-22965
    container_name: fullchain2_spring
    volumes:
      - ./flag_without_ignore/flag2_spring.txt:/tmp/flag.txt:ro
    networks:
      dmz_network:
        ipv4_address: 172.23.0.10
      internal_network:
        ipv4_address: 172.24.0.5
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:10000 || exit 1"]
      timeout: 30s
      retries: 3
      interval: 30s
      start_period: 60s

  # 第三层：内网目标 - Redis CVE-2022-0543 RCE
  redis-internal-service:
    image: vulhub/redis:5.0.7
    container_name: fullchain2_redis
    volumes:
      - ./flag_without_ignore/flag3_redis.txt:/tmp/flag.txt:ro
      - ./flag_without_ignore/final_secret.txt:/var/secret/final_secret.txt:ro
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping || exit 1"]
      timeout: 20s
      retries: 10
      interval: 30s
      start_period: 30s
  redis-internal-web:
    build: ./CVE-2022-0543/web
    depends_on:
      - redis-internal-service
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SERVER_PORT=6379
    networks:
      internal_network:
        ipv4_address: 172.24.0.10
  # 监控和管理容器
  monitor:
    image: alpine:latest
    container_name: fullchain2_monitor
    depends_on:
      - apache-entry
    command: >
      sh -c "
      echo 'FullChain Attack Environment Started' &&
      echo 'Entry Point: Port ${FC2_APACHE_PORT:-10000}' &&
      echo 'Challenge: Complete the three-stage attack chain' &&
      tail -f /dev/null
      "
    volumes:
      - ./logs:/var/log/fullchain2:rw
    networks:
      frontend_network:
        ipv4_address: 172.22.0.100

networks:
  # 前端网络 - 外网可访问
  frontend_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.22.0.0/16
          gateway: 172.22.0.1

  # DMZ网络 - 半隔离，连接前端和内网
  dmz_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.23.0.0/16
          gateway: 172.23.0.1

  # 内网 - 完全隔离，仅内部访问
  internal_network:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.24.0.0/16
          gateway: 172.24.0.1

volumes:
  redis_data:
    driver: local 