version: '3.8'
services:
  vulapp:
    build:
      context: ./vulnerable-app
      dockerfile: Dockerfile
    container_name: coraza-vulapp
    ports:
      - "${VULAPP_PORT:-5001}:5000"
    networks:
      - coraza-net

  chown:
    image: alpine:3.16
    command:
      - /bin/sh
      - -c
      - chown -R 101:101 /home/envoy/logs
    volumes:
      - logs:/home/envoy/logs:rw
    networks:
      - coraza-net

  envoy:
    depends_on:
      - chown
      - vulapp
    image: envoyproxy/envoy:v1.31-latest
    command:
      - -c
      - /conf/envoy-config.yaml
      - --log-level
      - info
      - --component-log-level
      - wasm:debug
      - --log-format
      - '[%Y-%m-%d %T.%f][%t][%l][%n] [%g:%#] %v'
      - --log-path
      - /home/envoy/logs/envoy.log
      - --service-cluster
      - envoy
      - --service-node
      - envoy
    volumes:
      - ./coraza-proxy-wasm/build:/build
      - .:/conf
      - logs:/home/envoy/logs:rw
    ports:
      - "${HTTP_PORT:-8081}:8080"
      - "${ADMIN_PORT:-8082}:8082"
    networks:
      - coraza-net

  envoy-logs:
    depends_on:
      - envoy
      - wasm-logs
    image: debian:11-slim
    entrypoint: bash
    command:
      - -c
      - tail -c +0 -f /home/envoy/logs/envoy.log
    volumes:
      - logs:/home/envoy/logs:ro
    networks:
      - coraza-net

  wasm-logs:
    depends_on:
      - envoy
    image: debian:11-slim
    entrypoint: bash
    command:
      - -c
      - tail -c +0 -f /home/envoy/logs/envoy.log | grep --line-buffered "[critical][wasm]"
    volumes:
      - logs:/home/envoy/logs:ro
    networks:
      - coraza-net

  prometheus:
    image: prom/prometheus
    volumes:
      - ./coraza-proxy-wasm/example/envoy/prometheus.yaml:/etc/prometheus.yaml
    ports:
      - "9090:9090"
    command: "--config.file=/etc/prometheus.yaml"
    networks:
      - coraza-net

  grafana:
    image: grafana/grafana
    volumes:
      - ./coraza-proxy-wasm/example/envoy/grafana/grafana.ini:/etc/grafana/grafana.ini
      - ./coraza-proxy-wasm/example/envoy/grafana/datasource.yaml:/etc/grafana/provisioning/datasources/datasource.yaml
      - ./coraza-proxy-wasm/example/envoy/grafana/dashboard.yaml:/etc/grafana/provisioning/dashboards/dashboard.yaml
      - ./coraza-proxy-wasm/example/envoy/grafana/dashboard.json:/etc/grafana/provisioning/dashboards/dashboard.json
    ports:
      - "3000:3000"
    networks:
      - coraza-net

networks:
  coraza-net:
    driver: bridge

volumes:
  logs: 