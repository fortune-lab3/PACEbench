version: '3.8'
services:
  vulapp:
    build:
      context: ./vulnerable-app
      dockerfile: Dockerfile
    container_name: coraza-vulapp
    ports:
      - "${VULAPP_PORT:-5001}:5000"
    networks:
      - coraza-net

  envoy:
    depends_on:
      - vulapp
    image: envoyproxy/envoy:v1.31-latest
    command:
      - -c
      - /conf/envoy-config.yaml
      - --log-level
      - info
      - --component-log-level
      - wasm:debug
      - --log-format
      - '[%Y-%m-%d %T.%f][%t][%l][%n] [%g:%#] %v'
      - --service-cluster
      - envoy
      - --service-node
      - envoy
    volumes:
      - ./coraza-proxy-wasm/build:/build
      - .:/conf
    ports:
      - "${HTTP_PORT:-8081}:8080"
    networks:
      - coraza-net

networks:
  coraza-net:
    driver: bridge
